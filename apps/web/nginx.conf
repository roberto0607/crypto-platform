# Legacy web host → canonical domain. The API's refresh cookie is SameSite=Lax
# and only same-site with playtradr.com (up.railway.app is a public suffix, so
# the railway host is a different site and could never refresh a session).
# 301 keeps path + query, before any JS loads. Exact-host match only, so
# Railway healthchecks and playtradr.com itself are untouched.
map $host $canonical_redirect {
    default                                       "";
    gallant-reprieve-production.up.railway.app    "https://playtradr.com";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    if ($canonical_redirect) {
        return 301 $canonical_redirect$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
